yaml
name: Build Wolf Pac APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'WolfPacAndroid_proyecto.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract project
        run: unzip -q WolfPacAndroid_proyecto.zip
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        working-directory: WolfPacAndroid
        run: chmod +x gradlew
      - name: Build debug APK
        working-directory: WolfPacAndroid
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wolf-Pac-debug-APK
          path: WolfPacAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
